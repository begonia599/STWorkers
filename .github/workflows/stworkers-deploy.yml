name: STWorkers - Prepare Plugins and Deploy

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: Update the existing Cloudflare instance after verification
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: stworkers-cloudflare-deploy
  cancel-in-progress: false

jobs:
  prepare-and-deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CI: 'true'
      WRANGLER_SEND_METRICS: 'false'
      STWORKERS_WORKER_NAME: ${{ vars.STWORKERS_WORKER_NAME }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      STWORKERS_D1_DATABASE_ID: ${{ vars.STWORKERS_D1_DATABASE_ID }}
    steps:
      - name: Check out the selected revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up the verified Node version
        uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e # v4.3.0
        with:
          node-version: '22.14.0'
      - name: Check deployment selection
        if: ${{ inputs.deploy }}
        env:
          STWORKERS_DEPLOY: 'true'
          STWORKERS_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: node cloudflare/scripts/github-actions.mjs guard
      - name: Install locked project dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install locked Worker tooling without lifecycle scripts
        run: npm --prefix cloudflare ci --ignore-scripts --no-audit --no-fund
      - name: Run contract and safety tests
        run: npm --prefix cloudflare test
      - name: Download pinned plugins, package original assets, and dry-run
        run: node cloudflare/scripts/github-actions.mjs build
      - name: Verify bindings and update the existing instance
        if: ${{ inputs.deploy }}
        env:
          STWORKERS_DEPLOY: 'true'
          STWORKERS_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node cloudflare/scripts/github-actions.mjs deploy
