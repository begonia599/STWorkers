name: 问题反馈
description: 反馈 STWorkers 部署、登录、聊天、插件兼容或其他遗留问题，支持中文。
title: '[Bug] '
body:
  - type: markdown
    attributes:
      value: |
        当前版本是 STWorkers 最低限度核心功能部署测试版，不代表最终功能范围和优化效果。
        欢迎反馈，包括酒馆助手、EJS 和角色卡兼容问题；不要求先关闭所有插件或确定问题原因。
        可先查看 [已有问题](https://github.com/begonia599/STWorkers/issues)，避免重复提交。
        请勿上传密码、Token、模型 API Key、DATA_KEY、Cookie 或私人聊天；附件须有权分享并已脱敏。

  - type: dropdown
    id: stage
    attributes:
      label: 问题发生在哪个环节？
      options:
        - Cloudflare 部署或更新
        - 登录、账号或密码恢复
        - 模型连接或聊天生成
        - 角色卡、预设、世界书、正则或宏
        - 插件安装或兼容性
        - 数据保存、导入或导出
        - 其他或不确定
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: 使用环境
      description: 手机或电脑、系统、浏览器，以及部署方式；知道多少填写多少。
      placeholder: 例如：安卓手机，Chrome，通过 README 的 Cloudflare 按钮部署。

  - type: input
    id: version
    attributes:
      label: STWorkers 版本
      description: 可以填写提交号、Cloudflare 部署版本或部署时间，不清楚可留空。

  - type: textarea
    id: repro
    attributes:
      label: 问题现象与复现步骤
      description: 请说明做了什么、期望什么、实际发生了什么；偶发或无法稳定复现也可以反馈。
      placeholder: |
        操作步骤：
        预期结果：
        实际结果或报错：
    validations:
      required: true

  - type: textarea
    id: related
    attributes:
      label: 相关插件或角色卡
      description: 如涉及插件或角色卡，请提供名称、版本或可公开的来源。原版 ST 对照结果可选，不是提交前提。

  - type: textarea
    id: evidence
    attributes:
      label: 脱敏日志、截图或最小复现样例
      description: 可补充构建日志、浏览器错误或有权分享的测试附件。请先移除凭据及私人内容，不要直接上传完整网络抓包。
