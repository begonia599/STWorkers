name: 功能缺失与建议
description: 提出 STWorkers 当前缺失的核心功能、兼容需求或部署与使用体验改进，支持中文。
title: '[Feature] '
body:
  - type: markdown
    attributes:
      value: |
        当前部署测试版不是 STWorkers 的最终形态，欢迎提出功能缺失和后续优化建议。
        可先查看 [已有建议](https://github.com/begonia599/STWorkers/issues) 和 [项目目标](https://github.com/begonia599/STWorkers/blob/main/docs/GOALS.md)。
        本地模型管理、服务端推理、语音、生图和公共多租户服务仍不在项目范围内。
        提交建议不等于承诺全部采纳；请勿附上密码、Token、模型 API Key、DATA_KEY、Cookie 或私人聊天。

  - type: textarea
    id: scenario
    attributes:
      label: 使用场景与当前缺失
      description: 想完成什么操作？当前哪里缺少功能或使用不方便？无需提供技术方案。
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 期望的效果
      description: 描述希望增加或改善的行为；也可以附上原版 ST 的操作方式或相关插件用法。

  - type: textarea
    id: alternatives
    attributes:
      label: 当前的临时办法
      description: 如已有替代操作或绕过方式，可在这里说明，没有可留空。

  - type: textarea
    id: context
    attributes:
      label: 补充资料
      description: 可提供相关版本、公开链接、脱敏截图或有权分享的最小样例。
